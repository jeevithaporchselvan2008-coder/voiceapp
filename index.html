<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujjwala Voice Help</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}main{max-width:760px;margin:auto;padding:25px 18px}h1{font-size:clamp(24px,7vw,36px)}.sub{color:#aebdd0}.lang{margin:12px;padding:9px;background:#0e1d30;color:white;border:1px solid #31445c;border-radius:10px}.mic{display:block;margin:7vh auto 0;width:min(70vw,410px);height:min(70vw,410px);min-width:230px;min-height:230px;border:0;border-radius:50%;background:#1769e8;color:white;font-size:100px;box-shadow:0 22px 70px #1769e855}.listen{background:#e05252!important}.speak{background:#18a673!important}.status{font-size:21px;font-weight:700;margin:25px}.box{background:#14243a;padding:16px 18px;border-radius:18px;margin-top:12px;text-align:left;font-size:20px;line-height:1.5}.reply{background:#163a31}.tag{display:block;color:#91a5be;font-size:13px;margin-bottom:5px}.hidden{display:none}.error{background:#4a2029;padding:14px;border-radius:14px;margin-top:15px}.note{color:#71849c;font-size:12px;margin-top:22px}</style></head>
<body><main><h1>Ujjwala Voice Help</h1><div class="sub">Free voice-first prototype — no API key</div>
<select id="lang" class="lang"><option value="en-IN">English</option><option value="ta-IN">தமிழ்</option><option value="hi-IN">हिन्दी</option><option value="te-IN">తెలుగు</option><option value="kn-IN">ಕನ್ನಡ</option><option value="ml-IN">മലയാളം</option></select>
<button id="mic" class="mic">🎙️</button><div id="status" class="status">Tap the microphone and speak</div>
<div id="youbox" class="box hidden"><span class="tag">You said</span><span id="you"></span></div>
<div id="replybox" class="box reply hidden"><span class="tag">Assistant</span><span id="reply"></span></div>
<div id="error" class="error hidden"></div><div class="note">Pradhan Mantri Ujjwala Yojana prototype. Verify official scheme rules before relying on answers.</div></main>
<script>
const mic=document.getElementById('mic'),status=document.getElementById('status'),lang=document.getElementById('lang'),youbox=document.getElementById('youbox'),replybox=document.getElementById('replybox'),you=document.getElementById('you'),reply=document.getElementById('reply'),error=document.getElementById('error');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const R={
'en-IN':['Hello. I can help you with the Ujjwala gas scheme. Do you want to know how to apply?','I can help with the Ujjwala scheme. Do you already have a gas connection?'],
'ta-IN':['வணக்கம். உஜ்வாலா எரிவாயு திட்டத்தைப் பற்றி நான் உதவுகிறேன். எப்படி விண்ணப்பிப்பது என்று தெரிந்துகொள்ள விரும்புகிறீர்களா?','உஜ்வாலா திட்டத்தைப் பற்றி நான் உதவுகிறேன். உங்களிடம் ஏற்கனவே எரிவாயு இணைப்பு உள்ளதா?'],
'hi-IN':['नमस्ते। मैं उज्ज्वला गैस योजना के बारे में मदद कर सकता हूँ। क्या आप आवेदन करने का तरीका जानना चाहते हैं?','मैं उज्ज्वला योजना के बारे में मदद कर सकता हूँ। क्या आपके पास पहले से गैस कनेक्शन है?'],
'te-IN':['నమస్కారం. ఉజ్వల గ్యాస్ పథకం గురించి నేను సహాయం చేస్తాను. ఎలా దరఖాస్తు చేయాలో తెలుసుకోవాలా?','ఉజ్వల పథకం గురించి నేను సహాయం చేస్తాను. మీకు ఇప్పటికే గ్యాస్ కనెక్షన్ ఉందా?'],
'kn-IN':['ನಮಸ್ಕಾರ. ಉಜ್ವಲ ಗ್ಯಾಸ್ ಯೋಜನೆಯ ಬಗ್ಗೆ ನಾನು ಸಹಾಯ ಮಾಡುತ್ತೇನೆ. ಅರ್ಜಿ ಹೇಗೆ ಸಲ್ಲಿಸಬೇಕು ಎಂದು ತಿಳಿಯಬೇಕೆ?','ಉಜ್ವಲ ಯೋಜನೆಯ ಬಗ್ಗೆ ನಾನು ಸಹಾಯ ಮಾಡುತ್ತೇನೆ. ನಿಮ್ಮ ಬಳಿ ಈಗಾಗಲೇ ಗ್ಯಾಸ್ ಸಂಪರ್ಕ ಇದೆಯೇ?'],
'ml-IN':['നമസ്കാരം. ഉജ്വല ഗ്യാസ് പദ്ധതിയെക്കുറിച്ച് ഞാൻ സഹായിക്കാം. എങ്ങനെ അപേക്ഷിക്കാമെന്ന് അറിയണോ?','ഉജ്വല പദ്ധതിയെക്കുറിച്ച് ഞാൻ സഹായിക്കാം. നിങ്ങൾക്ക് ഇതിനകം ഗ്യാസ് കണക്ഷൻ ഉണ്ടോ?']};
function fail(x){error.textContent=x;error.classList.remove('hidden');mic.className='mic';status.textContent='Tap the microphone and speak'}
function speak(x){const u=new SpeechSynthesisUtterance(x);u.lang=lang.value;u.rate=.82;u.onstart=()=>{mic.className='mic speak';status.textContent='Speaking…'};u.onend=()=>{mic.className='mic';status.textContent='Tap the microphone and speak'};speechSynthesis.cancel();speechSynthesis.speak(u)}
mic.onclick=()=>{if(!SR)return fail('Speech recognition is not supported here. Please use Chrome on Android or Chrome on a computer.');error.classList.add('hidden');const r=new SR();r.lang=lang.value;r.continuous=false;r.interimResults=false;r.onstart=()=>{mic.className='mic listen';status.textContent='Listening…'};r.onresult=e=>{const t=e.results[0][0].transcript;you.textContent=t;youbox.classList.remove('hidden');const a=R[lang.value]||R['en-IN'];const q=/gas|connection|எரிவாயு|गैस|గ్యాస్|ಗ್ಯಾಸ್|ഗ്യാസ്/i.test(t)?a[1]:a[0];reply.textContent=q;replybox.classList.remove('hidden');speak(q)};r.onerror=()=>fail('I could not understand that. Please try again.');r.start()};
</script></body></html>
